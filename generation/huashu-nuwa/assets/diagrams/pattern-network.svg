<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Pattern network</title>
  <desc id="desc">A network connecting reusable skill design patterns extracted from Nuwa.</desc>
  <defs>
    <style>
      .bg{fill:#f6f1e6}
      .node{fill:#fffaf0;stroke:#8a1c0f;stroke-width:2}
      .node2{fill:#ede6d4;stroke:#94701f;stroke-width:2}
      .node3{fill:#e8f0e7;stroke:#2d6e4e;stroke-width:2}
      .text{fill:#1a1410;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:700}
      .tiny{fill:#8a7a66;font-family:"JetBrains Mono",monospace;font-size:13px}
      .edge{stroke:#8a7a66;stroke-width:2;fill:none;opacity:.75;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a7a66"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="650"/>
  <text class="tiny" x="52" y="44">PATTERN NETWORK / extracted from Nuwa</text>

  <path class="edge" d="M218 160 C300 120 380 120 462 160"/>
  <path class="edge" d="M590 160 C665 120 745 120 825 160"/>
  <path class="edge" d="M220 305 H455"/>
  <path class="edge" d="M590 305 H820"/>
  <path class="edge" d="M500 350 C470 430 395 455 315 485"/>
  <path class="edge" d="M680 350 C720 430 800 455 875 485"/>
  <path class="edge" d="M315 525 H855"/>
  <path class="edge" d="M962 190 C1035 255 1035 430 962 490"/>

  <rect class="node" x="80" y="125" width="170" height="70" rx="12"/>
  <text class="text" x="116" y="155">P1 按起点分路</text>
  <text class="tiny" x="112" y="178">route first</text>

  <rect class="node" x="455" y="125" width="170" height="70" rx="12"/>
  <text class="text" x="493" y="155">P2 六路取证</text>
  <text class="tiny" x="498" y="178">evidence split</text>

  <rect class="node2" x="820" y="125" width="190" height="70" rx="12"/>
  <text class="text" x="858" y="155">P3 来源质量阶梯</text>
  <text class="tiny" x="875" y="178">source ladder</text>

  <rect class="node3" x="80" y="270" width="190" height="70" rx="12"/>
  <text class="text" x="118" y="300">P4 便宜返工点</text>
  <text class="tiny" x="128" y="323">checkpoint</text>

  <rect class="node" x="455" y="270" width="190" height="70" rx="12"/>
  <text class="text" x="505" y="300">P5 三关筛选</text>
  <text class="tiny" x="512" y="323">model gate</text>

  <rect class="node" x="820" y="270" width="210" height="70" rx="12"/>
  <text class="text" x="858" y="300">P6 模型变行动协议</text>
  <text class="tiny" x="886" y="323">protocol</text>

  <rect class="node3" x="205" y="475" width="210" height="70" rx="12"/>
  <text class="text" x="250" y="505">P7 脚本接管脆弱步骤</text>
  <text class="tiny" x="270" y="528">scripts</text>

  <rect class="node2" x="805" y="475" width="210" height="70" rx="12"/>
  <text class="text" x="850" y="505">P8 边界写进产物</text>
  <text class="tiny" x="870" y="528">boundaries</text>

  <text class="tiny" x="52" y="608">读法：先看入口和证据，再看检查点和筛选，最后看协议、脚本、边界如何接住失败。</text>
</svg>
