<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">三个标准筛心智模型的判定流程</title>
  <desc id="desc">候选论点经过三个标准（跨域复现 / 生成力 / 排他性）的机械判定，最终分到三个抽屉：心智模型（核心）、决策启发式（第二档）、不要。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a04018"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5d544a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="12" fill="#f7f4ef"/>

  <!-- Header -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="44" font-size="12" font-weight="720" fill="#a04018" letter-spacing="2">三个机械标准 · 候选论点的判定流程</text>
    <line x1="40" y1="56" x2="1160" y2="56" stroke="#e0d6c5" stroke-width="1"/>
  </g>

  <!-- Input pool -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f1b16">
    <g transform="translate(440 90)">
      <rect width="320" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="160" y="32" text-anchor="middle" font-weight="660">候选池</text>
      <text x="160" y="56" text-anchor="middle" font-size="12" fill="#5d544a">从 6 维 research md 列出 30 多个候选论点</text>
    </g>
  </g>

  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="600" y1="170" x2="600" y2="210"/>
  </g>

  <!-- Three criteria as rounded boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f1b16">
    <g transform="translate(60 220)">
      <rect width="320" height="100" rx="10" fill="#ffffff" stroke="#a04018"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660" fill="#a04018">标准 1 · 跨域复现</text>
      <text x="160" y="56" text-anchor="middle" font-size="12" fill="#5d544a">这个论点是否在 ≥2 个</text>
      <text x="160" y="76" text-anchor="middle" font-size="12" fill="#5d544a">不同领域中反复出现？</text>
      <text x="160" y="94" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">例：投资 + 教育 + 婚姻</text>
    </g>
    <g transform="translate(440 220)">
      <rect width="320" height="100" rx="10" fill="#ffffff" stroke="#a04018"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660" fill="#a04018">标准 2 · 生成力</text>
      <text x="160" y="56" text-anchor="middle" font-size="12" fill="#5d544a">用这个论点能不能推断</text>
      <text x="160" y="76" text-anchor="middle" font-size="12" fill="#5d544a">他对全新问题的立场？</text>
      <text x="160" y="94" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">例：他会怎么看 AI 创业？</text>
    </g>
    <g transform="translate(820 220)">
      <rect width="320" height="100" rx="10" fill="#ffffff" stroke="#a04018"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660" fill="#a04018">标准 3 · 排他性</text>
      <text x="160" y="56" text-anchor="middle" font-size="12" fill="#5d544a">是不是所有聪明人都</text>
      <text x="160" y="76" text-anchor="middle" font-size="12" fill="#5d544a">这样想？（不应该是）</text>
      <text x="160" y="94" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">例：能力圈 ≈ 太常见</text>
    </g>
  </g>

  <!-- Arrows down to counting node -->
  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="320" x2="500" y2="380"/>
    <line x1="600" y1="320" x2="600" y2="380"/>
    <line x1="980" y1="320" x2="700" y2="380"/>
  </g>

  <!-- Count node -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f1b16">
    <g transform="translate(460 390)">
      <rect width="280" height="60" rx="10" fill="#2d4858" stroke="#2d4858"/>
      <text x="140" y="36" text-anchor="middle" font-weight="660" fill="#ffffff">数一数通过几个标准</text>
    </g>
  </g>

  <!-- Arrows fanning to three buckets -->
  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="450" x2="200" y2="550"/>
    <line x1="600" y1="450" x2="600" y2="550"/>
    <line x1="700" y1="450" x2="1000" y2="550"/>
  </g>

  <!-- Three outcome buckets -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f1b16">
    <g transform="translate(40 560)">
      <rect width="320" height="140" rx="10" fill="#f5e3d6" stroke="#a04018"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660" fill="#a04018">三个都通过</text>
      <line x1="20" y1="44" x2="300" y2="44" stroke="#e0d6c5"/>
      <text x="160" y="68" text-anchor="middle" font-size="12" fill="#1f1b16" font-weight="660">→ 算心智模型</text>
      <text x="160" y="90" text-anchor="middle" font-size="11" fill="#5d544a">进 SKILL.md 的『心智模型』那一节</text>
      <text x="160" y="112" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">例：芒格 · 逆向思维</text>
      <text x="160" y="130" text-anchor="middle" font-size="11" fill="#5d544a">最终留 top 3-7 个（贪多不达）</text>
    </g>
    <g transform="translate(440 560)">
      <rect width="320" height="140" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660">只通过 1-2 个</text>
      <line x1="20" y1="44" x2="300" y2="44" stroke="#e0d6c5"/>
      <text x="160" y="68" text-anchor="middle" font-size="12" fill="#1f1b16" font-weight="660">→ 退一档变成决策启发式</text>
      <text x="160" y="90" text-anchor="middle" font-size="11" fill="#5d544a">进『决策启发式』那一节</text>
      <text x="160" y="112" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">例：芒格 · 能力圈</text>
      <text x="160" y="130" text-anchor="middle" font-size="11" fill="#5d544a">通常 5-10 条，每条配场景 + 案例</text>
    </g>
    <g transform="translate(840 560)">
      <rect width="320" height="140" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="160" y="30" text-anchor="middle" font-weight="660">一个都没通过</text>
      <line x1="20" y1="44" x2="300" y2="44" stroke="#e0d6c5"/>
      <text x="160" y="68" text-anchor="middle" font-size="12" fill="#1f1b16" font-weight="660">→ 不要</text>
      <text x="160" y="90" text-anchor="middle" font-size="11" fill="#5d544a">这条只是这个人某次随口说过</text>
      <text x="160" y="112" text-anchor="middle" font-size="11" fill="#5d544a">不进 SKILL.md 任何一节</text>
      <text x="160" y="130" text-anchor="middle" font-size="11" fill="#5d544a" font-style="italic">不调和、不可惜、不强塞</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5d544a">
    <line x1="40" y1="720" x2="1160" y2="720" stroke="#e0d6c5"/>
    <text x="40" y="745">▸ 三个机械标准比品味判断更靠谱 —— 听起来对≠真独特。三标准让筛选基于可列证据的客观判断。</text>
  </g>
</svg>
