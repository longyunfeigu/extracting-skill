<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">7 个可复用设计招之间的关系</title>
  <desc id="desc">展示分流、证据库、多维证据、检查点、筛选、研究流程和修复闭环之间的依赖。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7a66"/>
    </marker>
    <style>
      .bg { fill: #f6f1e6; }
      .node { fill: #fffaf0; stroke: #d8cdb6; stroke-width: 1.5; }
      .nodeCore { fill: #8a1c0f; stroke: #8a1c0f; stroke-width: 1.5; }
      .link { stroke: #8a7a66; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .linkStrong { stroke: #8a1c0f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .kicker { font: 700 12px "PingFang SC", sans-serif; letter-spacing: 2px; fill: #8a1c0f; }
      .title { font: 800 24px "Songti SC", serif; fill: #1a1410; }
      .p { font: 800 13px "PingFang SC", sans-serif; fill: #8a1c0f; }
      .pWhite { font: 800 13px "PingFang SC", sans-serif; fill: #f6f1e6; }
      .label { font: 800 17px "Songti SC", serif; fill: #1a1410; }
      .labelWhite { font: 800 17px "Songti SC", serif; fill: #f6f1e6; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text class="kicker" x="54" y="56">PATTERN NETWORK</text>
  <text class="title" x="54" y="92">这些招不是平铺清单：证据、筛选和修复互相接力</text>

  <path class="linkStrong" d="M236 190 C330 146 420 146 510 190"/>
  <path class="linkStrong" d="M614 190 C704 146 795 146 884 190"/>
  <path class="link" d="M560 234 V306"/>
  <path class="linkStrong" d="M472 372 C376 420 286 420 194 372"/>
  <path class="link" d="M648 372 C746 420 838 420 926 372"/>
  <path class="link" d="M236 226 C275 292 332 326 410 338"/>
  <path class="link" d="M884 226 C842 292 780 326 710 338"/>

  <g transform="translate(100 150)">
    <rect class="node" width="190" height="76" rx="10"/>
    <text class="p" x="20" y="28">P1</text>
    <text class="label" x="20" y="55">先分流，再执行</text>
  </g>

  <g transform="translate(465 150)">
    <rect class="nodeCore" width="190" height="76" rx="10"/>
    <text class="pWhite" x="20" y="28">P2</text>
    <text class="labelWhite" x="20" y="55">自包含证据库</text>
  </g>

  <g transform="translate(830 150)">
    <rect class="node" width="190" height="76" rx="10"/>
    <text class="p" x="20" y="28">P3</text>
    <text class="label" x="20" y="55">多维证据收集</text>
  </g>

  <g transform="translate(100 330)">
    <rect class="node" width="190" height="76" rx="10"/>
    <text class="p" x="20" y="28">P4</text>
    <text class="label" x="20" y="55">便宜处停一下</text>
  </g>

  <g transform="translate(465 330)">
    <rect class="nodeCore" width="190" height="76" rx="10"/>
    <text class="pWhite" x="20" y="28">P5</text>
    <text class="labelWhite" x="20" y="55">三道筛再命名</text>
  </g>

  <g transform="translate(830 330)">
    <rect class="node" width="190" height="76" rx="10"/>
    <text class="p" x="20" y="28">P6</text>
    <text class="label" x="20" y="55">模型推研究流程</text>
  </g>

  <g transform="translate(465 455)">
    <rect class="node" width="190" height="76" rx="10"/>
    <text class="p" x="20" y="28">P7</text>
    <text class="label" x="20" y="55">检查接修复</text>
  </g>
</svg>
