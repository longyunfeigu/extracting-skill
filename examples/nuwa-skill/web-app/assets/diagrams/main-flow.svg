<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-label="Walkthrough 顶层流程图：5 个大段 14 个 stage 的拓扑">
  <defs>
    <marker id="mf-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#8a1c0f" />
    </marker>
    <style>
      .mf-bg { fill: #f6f1e6; }
      .mf-phase { fill: #ede6d4; stroke: #d8cdb6; stroke-width: 1.4; }
      .mf-cp { fill: rgba(138, 28, 15, 0.08); stroke: #8a1c0f; stroke-width: 1.6; stroke-dasharray: 4 3; }
      .mf-label { font: 700 15px "Noto Serif SC", Georgia, serif; fill: #1a1410; }
      .mf-stages { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a7a66; letter-spacing: 0.08em; }
      .mf-arrow { stroke: #8a1c0f; stroke-width: 1.6; fill: none; }
      .mf-title { font: 700 16px "Noto Serif SC", Georgia, serif; fill: #1a1410; }
      .mf-kicker { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a7a66; letter-spacing: 0.16em; text-transform: uppercase; }
      .mf-accent { stroke: #8a1c0f; stroke-width: 1.6; }
    </style>
  </defs>
  <rect class="mf-bg" width="1000" height="240" />
  <text class="mf-kicker" x="40" y="28">先看大流水线</text>
  <text class="mf-title" x="40" y="52">5 个大段 · 14 个 stage · 3 道便宜返工点</text>
  <line class="mf-accent" x1="40" y1="66" x2="120" y2="66" />

  <!-- Boxes -->
  <g transform="translate(40, 100)">
    <rect class="mf-phase" x="0" y="0" width="160" height="80" rx="6" />
    <text class="mf-label" x="80" y="32" text-anchor="middle">入口 + 准备</text>
    <text class="mf-stages" x="80" y="54" text-anchor="middle">3 个 stage</text>
    <text class="mf-stages" x="80" y="70" text-anchor="middle">分流 / 澄清 / 建目录</text>
  </g>
  <path class="mf-arrow" d="M 200 140 L 230 140" marker-end="url(#mf-arrow)" />
  <g transform="translate(240, 100)">
    <rect class="mf-phase" x="0" y="0" width="160" height="80" rx="6" />
    <text class="mf-label" x="80" y="32" text-anchor="middle">采集 + 检查</text>
    <text class="mf-stages" x="80" y="54" text-anchor="middle">3 个 stage · ★ 检查点 1.5</text>
    <text class="mf-stages" x="80" y="70" text-anchor="middle">6 agent / 著作样本 / 拍板</text>
  </g>
  <path class="mf-arrow" d="M 400 140 L 430 140" marker-end="url(#mf-arrow)" />
  <g transform="translate(440, 100)">
    <rect class="mf-phase" x="0" y="0" width="160" height="80" rx="6" />
    <text class="mf-label" x="80" y="32" text-anchor="middle">提炼 + 检查</text>
    <text class="mf-stages" x="80" y="54" text-anchor="middle">3 个 stage · ★ 检查点 2.5</text>
    <text class="mf-stages" x="80" y="70" text-anchor="middle">三重验证 / DNA / 拍板</text>
  </g>
  <path class="mf-arrow" d="M 600 140 L 630 140" marker-end="url(#mf-arrow)" />
  <g transform="translate(640, 100)">
    <rect class="mf-phase" x="0" y="0" width="160" height="80" rx="6" />
    <text class="mf-label" x="80" y="32" text-anchor="middle">构建 + 验证</text>
    <text class="mf-stages" x="80" y="54" text-anchor="middle">3 个 stage · ★ 检查点 4</text>
    <text class="mf-stages" x="80" y="70" text-anchor="middle">反推 protocol / 套模板 / 三类测试</text>
  </g>
  <path class="mf-arrow" d="M 800 140 L 830 140" marker-end="url(#mf-arrow)" />
  <g transform="translate(840, 100)">
    <rect class="mf-phase" x="0" y="0" width="120" height="80" rx="6" />
    <text class="mf-label" x="60" y="32" text-anchor="middle">精炼 + 交付</text>
    <text class="mf-stages" x="60" y="54" text-anchor="middle">2 个 stage</text>
    <text class="mf-stages" x="60" y="70" text-anchor="middle">双 agent 改进 / 交付</text>
  </g>

  <text class="mf-stages" x="40" y="220">14 stage 的一行摘要见下面索引表；这张图只画 5 个大段的拓扑，不展开 stage 内部。</text>
</svg>
