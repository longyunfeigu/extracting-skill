<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">女娲运行主流程</title>
  <desc id="desc">9 个 stage 分成确认、证据、提炼、构建和验证五段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a1c0f"/>
    </marker>
    <style>
      .bg { fill: #f6f1e6; }
      .box { fill: #fffaf0; stroke: #d8cdb6; stroke-width: 1.5; }
      .accent { fill: #8a1c0f; }
      .line { stroke: #8a1c0f; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .kicker { font: 700 12px "PingFang SC", sans-serif; letter-spacing: 2px; fill: #8a1c0f; }
      .title { font: 800 25px "Songti SC", serif; fill: #1a1410; }
      .label { font: 800 20px "Songti SC", serif; fill: #1a1410; }
      .small { font: 500 14px "PingFang SC", sans-serif; fill: #4a3f33; }
      .stage { font: 700 12px "PingFang SC", sans-serif; fill: #8a1c0f; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="500"/>
  <text class="kicker" x="54" y="56">WALKTHROUGH MAP</text>
  <text class="title" x="54" y="92">9 个 stage，不是目录，是我作为 AI 的运行轨迹</text>

  <g transform="translate(70 160)">
    <rect class="box" width="168" height="150" rx="10"/>
    <text class="stage" x="22" y="35">STAGE 01-02</text>
    <text class="label" x="22" y="70">确认对象</text>
    <text class="small" x="22" y="104">分直接路径</text>
    <text class="small" x="22" y="128">确认用途和素材</text>
  </g>
  <path class="line" d="M252 235 H315"/>

  <g transform="translate(332 160)">
    <rect class="box" width="168" height="150" rx="10"/>
    <text class="stage" x="22" y="35">STAGE 03-05</text>
    <text class="label" x="22" y="70">建立证据</text>
    <text class="small" x="22" y="104">建目录</text>
    <text class="small" x="22" y="128">六路调研 + review</text>
  </g>
  <path class="line" d="M514 235 H577"/>

  <g transform="translate(594 160)">
    <rect class="box" width="168" height="150" rx="10"/>
    <text class="stage" x="22" y="35">STAGE 06</text>
    <text class="label" x="22" y="70">筛出框架</text>
    <text class="small" x="22" y="104">三重验证</text>
    <text class="small" x="22" y="128">模型 / 启发式</text>
  </g>
  <path class="line" d="M776 235 H839"/>

  <g transform="translate(856 160)">
    <rect class="box" width="168" height="150" rx="10"/>
    <text class="stage" x="22" y="35">STAGE 07</text>
    <text class="label" x="22" y="70">构建 Skill</text>
    <text class="small" x="22" y="104">套模板</text>
    <text class="small" x="22" y="128">生成回答工作流</text>
  </g>

  <path class="line" d="M940 326 C940 398 178 398 178 326"/>
  <g transform="translate(330 358)">
    <rect class="box" width="460" height="92" rx="10"/>
    <text class="stage" x="24" y="32">STAGE 08-09</text>
    <text class="label" x="24" y="61">验证、修复、精炼或增量更新</text>
  </g>
</svg>
