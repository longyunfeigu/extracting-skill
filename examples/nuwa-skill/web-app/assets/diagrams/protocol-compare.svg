<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="三人 Agentic Protocol 横向对照表：塔勒布 / 费曼 / MrBeast 的核心心智模型和反推研究维度对比">
  <defs>
    <style>
      .pc-bg { fill: #f6f1e6; }
      .pc-title { font: 700 17px "Noto Serif SC", Georgia, serif; fill: #1a1410; }
      .pc-kicker { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a7a66; letter-spacing: 0.16em; text-transform: uppercase; }
      .pc-col-head { fill: #1a1410; }
      .pc-col-head-text { font: 700 18px "Noto Serif SC", Georgia, serif; fill: #f6f1e6; }
      .pc-col-head-sub { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #d8cdb6; letter-spacing: 0.06em; }
      .pc-row-label { font: 700 12px "JetBrains Mono", ui-monospace, monospace; fill: #8a1c0f; letter-spacing: 0.14em; text-transform: uppercase; }
      .pc-cell-bg-a { fill: #ede6d4; }
      .pc-cell-bg-b { fill: #f6f1e6; }
      .pc-cell-text { font: 14.5px "Noto Serif SC", Georgia, serif; fill: #1a1410; }
      .pc-cell-text-sub { font: 13px "Noto Serif SC", Georgia, serif; fill: #4a3f33; }
      .pc-rule { stroke: #d8cdb6; stroke-width: 1; }
      .pc-takeaway { font: italic 14px "Noto Serif SC", Georgia, serif; fill: #4a3f33; }
      .pc-accent-rule { stroke: #8a1c0f; stroke-width: 1.6; }
    </style>
  </defs>
  <rect class="pc-bg" width="1000" height="460" />

  <text class="pc-kicker" x="40" y="30">同一个外壳 · 三个人</text>
  <text class="pc-title" x="40" y="54">Agentic Protocol 反推：先看什么取决于他的心智模型</text>
  <line class="pc-accent-rule" x1="40" y1="68" x2="120" y2="68" />

  <!-- Column heads -->
  <g transform="translate(40, 90)">
    <rect class="pc-col-head" x="180" y="0" width="240" height="56" />
    <text class="pc-col-head-text" x="300" y="28" text-anchor="middle">塔勒布</text>
    <text class="pc-col-head-sub" x="300" y="46" text-anchor="middle">Nassim Taleb · 思想家</text>

    <rect class="pc-col-head" x="430" y="0" width="240" height="56" />
    <text class="pc-col-head-text" x="550" y="28" text-anchor="middle">费曼</text>
    <text class="pc-col-head-sub" x="550" y="46" text-anchor="middle">Richard Feynman · 物理学家</text>

    <rect class="pc-col-head" x="680" y="0" width="240" height="56" />
    <text class="pc-col-head-text" x="800" y="28" text-anchor="middle">MrBeast</text>
    <text class="pc-col-head-sub" x="800" y="46" text-anchor="middle">Jimmy Donaldson · 内容创作</text>
  </g>

  <!-- Row 1: 核心心智模型 -->
  <g transform="translate(40, 152)">
    <rect class="pc-cell-bg-a" x="0" y="0" width="170" height="120" />
    <text class="pc-row-label" x="14" y="28">行 1</text>
    <text class="pc-cell-text" x="14" y="54">核心心智模型</text>
    <text class="pc-cell-text-sub" x="14" y="76">三重验证过滤后</text>
    <text class="pc-cell-text-sub" x="14" y="94">留下的 3-7 个</text>

    <rect class="pc-cell-bg-b" x="180" y="0" width="240" height="120" />
    <text class="pc-cell-text" x="194" y="28">反脆弱偏好</text>
    <text class="pc-cell-text" x="194" y="50">Skin in the Game</text>
    <text class="pc-cell-text" x="194" y="72">林迪效应</text>
    <text class="pc-cell-text" x="194" y="94">Via Negativa（减法）</text>
    <text class="pc-cell-text-sub" x="194" y="112">领域特异性</text>

    <rect class="pc-cell-bg-b" x="430" y="0" width="240" height="120" />
    <text class="pc-cell-text" x="444" y="28">第一性原理拆解</text>
    <text class="pc-cell-text" x="444" y="50">对权威的怀疑</text>
    <text class="pc-cell-text" x="444" y="72">视觉化理解</text>
    <text class="pc-cell-text" x="444" y="94">差分学习法</text>
    <text class="pc-cell-text-sub" x="444" y="112">能算出来再算</text>

    <rect class="pc-cell-bg-b" x="680" y="0" width="240" height="120" />
    <text class="pc-cell-text" x="694" y="28">注意力工程</text>
    <text class="pc-cell-text" x="694" y="50">A/B 测试驱动</text>
    <text class="pc-cell-text" x="694" y="72">规模化的极致</text>
    <text class="pc-cell-text" x="694" y="94">情绪曲线设计</text>
    <text class="pc-cell-text-sub" x="694" y="112">复投复利逻辑</text>
  </g>

  <line class="pc-rule" x1="40" y1="272" x2="960" y2="272" />

  <!-- Row 2: 反推研究维度 -->
  <g transform="translate(40, 282)">
    <rect class="pc-cell-bg-a" x="0" y="0" width="170" height="138" />
    <text class="pc-row-label" x="14" y="28">行 2</text>
    <text class="pc-cell-text" x="14" y="54">反推出来的</text>
    <text class="pc-cell-text" x="14" y="76">"先看什么" 维度</text>
    <text class="pc-cell-text-sub" x="14" y="98">Agentic Protocol</text>
    <text class="pc-cell-text-sub" x="14" y="116">的 Step 2</text>

    <rect class="pc-cell-bg-b" x="180" y="0" width="240" height="138" />
    <text class="pc-cell-text" x="194" y="28">看风险</text>
    <text class="pc-cell-text" x="194" y="50">看脆弱性</text>
    <text class="pc-cell-text" x="194" y="72">看历史</text>
    <text class="pc-cell-text" x="194" y="94">看叙事</text>
    <text class="pc-cell-text" x="194" y="116">看皮肤在场</text>

    <rect class="pc-cell-bg-b" x="430" y="0" width="240" height="138" />
    <text class="pc-cell-text" x="444" y="28">看基本物理约束</text>
    <text class="pc-cell-text" x="444" y="50">看官方说法的漏洞</text>
    <text class="pc-cell-text" x="444" y="72">看实验数据</text>
    <text class="pc-cell-text" x="444" y="94">看类比</text>
    <text class="pc-cell-text-sub" x="444" y="116">— 不看排行榜 / 不看趋势</text>

    <rect class="pc-cell-bg-b" x="680" y="0" width="240" height="138" />
    <text class="pc-cell-text" x="694" y="28">看 CTR 和 AVD</text>
    <text class="pc-cell-text" x="694" y="50">看竞品 Top 10</text>
    <text class="pc-cell-text" x="694" y="72">看搜索趋势</text>
    <text class="pc-cell-text" x="694" y="94">看成本回报</text>
    <text class="pc-cell-text-sub" x="694" y="116">— 不看物理 / 不看历史</text>
  </g>

  <text class="pc-takeaway" x="40" y="446">同一个 protocol 外壳 · "先看什么" 全不一样 · 这就是 nuwa 反推不是写死模板的实证。</text>
</svg>
