<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">web-video-presentation 主流程</title>
  <desc id="desc">4 个 Phase + 2 个硬节点（Checkpoint Plan / Checkpoint Audio）的时间序流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a04018"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5d544a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="12" fill="#f7f4ef"/>

  <!-- Phase 1 header -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="44" font-size="12" font-weight="720" fill="#a04018" letter-spacing="2">PHASE 1 · 内容编写</text>
    <line x1="40" y1="56" x2="1160" y2="56" stroke="#e0d6c5" stroke-width="1"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f1b16">
    <g transform="translate(60 80)">
      <rect width="240" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="120" y="34" text-anchor="middle" font-weight="660">01 用户输入</text>
      <text x="120" y="56" text-anchor="middle" font-size="12" fill="#5d544a">文章 / 口播稿 / 空主题</text>
    </g>
    <g transform="translate(360 80)">
      <rect width="280" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="140" y="34" text-anchor="middle" font-weight="660">02 一次产出</text>
      <text x="140" y="56" text-anchor="middle" font-size="12" fill="#5d544a">script.md + outline.md（双源原则）</text>
    </g>
    <g transform="translate(700 80)">
      <rect width="220" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="110" y="34" text-anchor="middle" font-weight="660">03 自检 → 修复</text>
      <text x="110" y="56" text-anchor="middle" font-size="12" fill="#5d544a">Agent Teams / subAgent / 自检</text>
    </g>
    <g transform="translate(960 80)">
      <rect width="180" height="80" rx="10" fill="#2d4858" stroke="#2d4858"/>
      <text x="90" y="32" text-anchor="middle" font-weight="660" fill="#ffffff">★ 硬节点</text>
      <text x="90" y="58" text-anchor="middle" font-size="12" fill="#dde6ec">Checkpoint Plan</text>
    </g>
  </g>
  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="120" x2="358" y2="120"/>
    <line x1="640" y1="120" x2="698" y2="120"/>
    <line x1="920" y1="120" x2="958" y2="120"/>
  </g>

  <!-- Checkpoint Plan content -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5d544a">
    <text x="60" y="200" font-weight="660" fill="#a04018">Checkpoint Plan 一次对齐 5 件事：</text>
    <text x="60" y="222"><tspan fill="#1f1b16" font-weight="600">①</tspan> 稿子 (script.md)  <tspan fill="#1f1b16" font-weight="600">②</tspan> 计划 (outline.md)  <tspan fill="#1f1b16" font-weight="600">③</tspan> 主题（agent 主动推荐 2-3 个）  <tspan fill="#1f1b16" font-weight="600">④</tspan> 素材  <tspan fill="#1f1b16" font-weight="600">⑤</tspan> 开发模式（A/B/C）</text>
  </g>

  <!-- Phase 2 header -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="270" font-size="12" font-weight="720" fill="#a04018" letter-spacing="2">PHASE 2 · 网页开发</text>
    <line x1="40" y1="282" x2="1160" y2="282" stroke="#e0d6c5" stroke-width="1"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f1b16">
    <g transform="translate(60 306)">
      <rect width="240" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="120" y="34" text-anchor="middle" font-weight="660">04 脚手架</text>
      <text x="120" y="56" text-anchor="middle" font-size="12" fill="#5d544a">scaffold.sh + 删 example</text>
    </g>
    <g transform="translate(340 306)">
      <rect width="240" height="80" rx="10" fill="#f5e3d6" stroke="#a04018"/>
      <text x="120" y="34" text-anchor="middle" font-weight="660">05 第 1 章 ★ 风格锚点</text>
      <text x="120" y="56" text-anchor="middle" font-size="12" fill="#5d544a">主线程做完 + 用户验收</text>
    </g>
    <g transform="translate(620 306)">
      <rect width="280" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="140" y="34" text-anchor="middle" font-weight="660">06 第 2-N 章</text>
      <text x="140" y="56" text-anchor="middle" font-size="12" fill="#5d544a">A 逐章 / B 顺序 / C 并行 + 每章读 CHAPTER-CRAFT</text>
    </g>
    <g transform="translate(940 306)">
      <rect width="200" height="80" rx="10" fill="#2d4858" stroke="#2d4858"/>
      <text x="100" y="32" text-anchor="middle" font-weight="660" fill="#ffffff">★ 硬节点</text>
      <text x="100" y="58" text-anchor="middle" font-size="12" fill="#dde6ec">Checkpoint Audio</text>
    </g>
  </g>
  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="346" x2="338" y2="346"/>
    <line x1="580" y1="346" x2="618" y2="346"/>
    <line x1="900" y1="346" x2="938" y2="346"/>
  </g>

  <!-- narrations.ts side note for Phase 2 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5d544a">
    <text x="60" y="426" font-weight="660" fill="#a04018">每章产出三件套：</text>
    <text x="60" y="448" font-family="ui-monospace, Menlo, monospace" fill="#1f1b16" font-size="12">Chapter.tsx + Chapter.css + narrations.ts</text>
    <text x="60" y="468" font-size="12">narrations.ts 数组长度 = Chapter 最大 step + 1 → 这是运行时真相源</text>
  </g>

  <!-- Phase 3+4 header -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="510" font-size="12" font-weight="720" fill="#a04018" letter-spacing="2">PHASE 3 · 音频合成（可选） + PHASE 4 · 录屏</text>
    <line x1="40" y1="522" x2="1160" y2="522" stroke="#e0d6c5" stroke-width="1"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f1b16">
    <g transform="translate(60 546)">
      <rect width="280" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="140" y="32" text-anchor="middle" font-weight="660">07 audio-segments.json</text>
      <text x="140" y="56" text-anchor="middle" font-size="12" fill="#5d544a">extract-narrations 生成 → 用户审</text>
    </g>
    <g transform="translate(380 546)">
      <rect width="280" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="140" y="32" text-anchor="middle" font-weight="660">08 mp3 合成</text>
      <text x="140" y="56" text-anchor="middle" font-size="12" fill="#5d544a">mmx-cli 串行（增量、跳过已存在）</text>
    </g>
    <g transform="translate(700 546)">
      <rect width="240" height="80" rx="10" fill="#f5e3d6" stroke="#a04018"/>
      <text x="120" y="32" text-anchor="middle" font-weight="660">09 Auto 模式录屏</text>
      <text x="120" y="56" text-anchor="middle" font-size="12" fill="#5d544a">?auto=1 + 主时钟原则</text>
    </g>
    <g transform="translate(980 546)">
      <rect width="160" height="80" rx="10" fill="#ffffff" stroke="#e0d6c5"/>
      <text x="80" y="32" text-anchor="middle" font-weight="660">10 后期</text>
      <text x="80" y="56" text-anchor="middle" font-size="12" fill="#5d544a">裁头尾 / 配音</text>
    </g>
  </g>
  <g stroke="#a04018" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="340" y1="586" x2="378" y2="586"/>
    <line x1="660" y1="586" x2="698" y2="586"/>
    <line x1="940" y1="586" x2="978" y2="586"/>
  </g>

  <!-- Footer annotations -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5d544a">
    <line x1="40" y1="660" x2="1160" y2="660" stroke="#e0d6c5"/>
    <text x="40" y="685" font-weight="660" fill="#a04018">关键节点说明</text>
    <text x="40" y="708">▸ <tspan fill="#1f1b16" font-weight="600">硬节点（黑色）</tspan>：Checkpoint Plan / Checkpoint Audio——返工成本拐点，必须停下来让用户决定。</text>
    <text x="40" y="730">▸ <tspan fill="#1f1b16" font-weight="600">风格锚点（高亮）</tspan>：第 1 章必须主线程完整做完不能并行；Auto 模式只等音频不等动画（主时钟原则）。</text>
  </g>
</svg>
