# Structured output shape for a skill pattern extraction.
# Use YAML or convert to JSON if the user asks for JSON.

source:
  name: ""
  path: ""
  kind: "single-skill | skill-package | batch"
  files_read:
    - path: ""
      reason: ""

human_summary:
  wow_moment: ""
  bad_result_prevented: ""
  why_designed_this_way:
    - ""
  forces_agent_to:
    - ""
  blocks_agent_from:
    - ""
  run_flow:
    - step: 1
      name: ""
      purpose: ""
  package_layout:
    skill_md: ""
    references: ""
    scripts: ""
    examples: ""
    tests: ""
  too_heavy_when:
    - ""

patterns:
  - name: ""
    slug: ""
    status: "candidate | pattern"   # candidate = seen once; pattern = seen in 3+ unrelated skills
    prevents: ""
    forces:                          # tensions that make this solution non-obvious; required for pattern status
      - ""
    evidence_of_recurrence:          # list the skills you have actually seen this in
      - skill: ""
        path: ""
    use_when:
      - ""
    how_it_works:
      - ""
    usual_location:
      - "SKILL.md"
    costs:
      - ""
    combines_with:
      - ""
    reflection_in_action_warning: "" # when blindly applying this would be worse than thinking from scratch
    should_be_platform_feature: ""   # if every skill copies this, flag as deficiency, not pattern
    example:
      skill: ""
      path: ""
      note: ""

pattern_combinations:
  - use_case: ""
    patterns:
      - ""
    why: ""

gaps_or_risks:
  - ""

dimensions_resisting_rules:        # taste/aesthetic dimensions captured better by examples than rules
  - dimension: ""
    why_rules_fail: ""
    suggested_examples: ""
