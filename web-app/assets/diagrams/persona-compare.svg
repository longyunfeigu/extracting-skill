<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">同一个事实问题，不同人物先查的东西不同</title>
  <desc id="desc">比较塔勒布、芒格、费曼遇到事实问题时的研究入口。</desc>
  <defs>
    <style>
      .bg { fill: #f6f1e6; }
      .head { fill: #1a1410; }
      .row1 { fill: #fffaf0; }
      .row2 { fill: #ede6d4; opacity: .55; }
      .rule { stroke: #d8cdb6; stroke-width: 1.4; }
      .title { font: 800 25px "Songti SC", serif; fill: #1a1410; }
      .kicker { font: 700 12px "PingFang SC", sans-serif; letter-spacing: 2px; fill: #8a1c0f; }
      .th { font: 700 15px "PingFang SC", sans-serif; fill: #f6f1e6; }
      .name { font: 800 20px "Songti SC", serif; fill: #8a1c0f; }
      .body { font: 500 15px "PingFang SC", sans-serif; fill: #2b241f; }
      .note { font: italic 500 16px "Songti SC", serif; fill: #4a3f33; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="kicker" x="54" y="58">COMPARE</text>
  <text class="title" x="54" y="94">同一句“这家公司还能不能投”，不是所有人物都先查同一批事实</text>

  <rect class="head" x="54" y="132" width="1012" height="52" rx="8"/>
  <text class="th" x="82" y="164">人物 Skill</text>
  <text class="th" x="290" y="164">先查什么</text>
  <text class="th" x="650" y="164">为什么先查这些</text>

  <rect class="row1" x="54" y="184" width="1012" height="92"/>
  <text class="name" x="82" y="226">塔勒布</text>
  <text class="body" x="290" y="216">尾部风险、遍历性、谁承担后果、</text>
  <text class="body" x="290" y="242">主流叙事是否过度一致</text>
  <text class="body" x="650" y="216">他的判断从不对称性开始。</text>
  <text class="body" x="650" y="242">先看会不会一次出局。</text>

  <line class="rule" x1="54" y1="276" x2="1066" y2="276"/>
  <rect class="row2" x="54" y="276" width="1012" height="92"/>
  <text class="name" x="82" y="318">芒格</text>
  <text class="body" x="290" y="308">护城河、管理层激励、反面案例、</text>
  <text class="body" x="290" y="334">历史类比和机会成本</text>
  <text class="body" x="650" y="308">他的判断从多元模型和激励结构开始。</text>
  <text class="body" x="650" y="334">先找会让人变蠢的机制。</text>

  <line class="rule" x1="54" y1="368" x2="1066" y2="368"/>
  <rect class="row1" x="54" y="368" width="1012" height="92"/>
  <text class="name" x="82" y="410">费曼</text>
  <text class="body" x="290" y="400">基本事实、实验数据、概念定义、</text>
  <text class="body" x="290" y="426">权威说法有没有跳步</text>
  <text class="body" x="650" y="400">他的判断从“我真的懂了吗”开始。</text>
  <text class="body" x="650" y="426">先把漂亮名词拆到可验证。</text>

  <text class="note" x="54" y="493">女娲把心智模型变成研究入口。人物不同，先看的事实就不同。</text>
</svg>
