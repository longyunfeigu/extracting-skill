<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Protocol comparison</title>
  <desc id="desc">Comparison of research dimensions derived from different person models.</desc>
  <defs>
    <style>
      .bg{fill:#f6f1e6}
      .head{fill:#1a1410}
      .card{fill:#fffaf0;stroke:#d8cdb6;stroke-width:2}
      .accent{fill:#8a1c0f}
      .green{fill:#2d6e4e}
      .amber{fill:#94701f}
      .text{fill:#1a1410;font-family:"Noto Serif SC","Source Han Serif SC",serif;font-size:26px;font-weight:800}
      .small{fill:#4a3f33;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px}
      .tiny{fill:#8a7a66;font-family:"JetBrains Mono",monospace;font-size:13px}
      .label{fill:#fffaf0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1180" height="600"/>
  <text class="tiny" x="52" y="44">AGENTIC PROTOCOL / same question, different research habits</text>
  <text class="text" x="52" y="88">问题：这个新产品方向值得做吗？</text>

  <rect class="card" x="52" y="135" width="330" height="350" rx="12"/>
  <rect class="accent" x="82" y="165" width="120" height="34" rx="17"/>
  <text class="label" x="112" y="188">乔布斯</text>
  <text class="small" x="82" y="232">先查：</text>
  <text class="small" x="102" y="270">产品体验是否简洁</text>
  <text class="small" x="102" y="305">交互和工艺细节</text>
  <text class="small" x="102" y="340">硬件、软件、服务谁控制</text>
  <text class="small" x="102" y="375">市场时机和竞品体验</text>
  <line x1="82" y1="410" x2="352" y2="410" stroke="#d8cdb6"/>
  <text class="tiny" x="82" y="442">来自模型：聚焦、端到端控制、技术与人文</text>

  <rect class="card" x="425" y="135" width="330" height="350" rx="12"/>
  <rect class="green" x="455" y="165" width="120" height="34" rx="17"/>
  <text class="label" x="493" y="188">芒格</text>
  <text class="small" x="455" y="232">先查：</text>
  <text class="small" x="475" y="270">护城河是否真实</text>
  <text class="small" x="475" y="305">管理层激励结构</text>
  <text class="small" x="475" y="340">最大亏损路径</text>
  <text class="small" x="475" y="375">历史类比和反面案例</text>
  <line x1="455" y1="410" x2="725" y2="410" stroke="#d8cdb6"/>
  <text class="tiny" x="455" y="442">来自模型：逆向思考、多元模型、激励机制</text>

  <rect class="card" x="798" y="135" width="330" height="350" rx="12"/>
  <rect class="amber" x="828" y="165" width="120" height="34" rx="17"/>
  <text class="label" x="866" y="188">MrBeast</text>
  <text class="small" x="828" y="232">先查：</text>
  <text class="small" x="848" y="270">受众点击欲望</text>
  <text class="small" x="848" y="305">标题和缩略图测试空间</text>
  <text class="small" x="848" y="340">前 30 秒留存风险</text>
  <text class="small" x="848" y="375">竞品播放与互动数据</text>
  <line x1="828" y1="410" x2="1098" y2="410" stroke="#d8cdb6"/>
  <text class="tiny" x="828" y="442">来自模型：注意力工程、测试迭代、观众心理</text>

  <rect x="162" y="525" width="855" height="40" rx="20" fill="#ede6d4" stroke="#d8cdb6"/>
  <text class="small" x="242" y="551">Nuwa 的关键点：研究维度从心智模型推导，不从固定模板复制。</text>
</svg>
