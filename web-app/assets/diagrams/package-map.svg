<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">女娲源 skill 自包含目录 package map</title>
  <desc id="desc">SKILL.md / extraction-framework.md / skill-template.md / scripts / references 在同一目录协作。</desc>
  <defs>
    <marker id="parrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8794"/>
    </marker>
    <style>
      .bg { fill: #fafafa; }
      .band-label { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #5b6770; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a2330; }
      .container { fill: #f3eee5; stroke: #b0a288; stroke-width: 2; stroke-dasharray: 6 4; }
      .container-label { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #8a7654; }
      .container-sub { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #8a7654; }
      .entry { fill: #d6e4f2; stroke: #4a78a8; stroke-width: 2; }
      .meta-doc { fill: #ffffff; stroke: #4a78a8; stroke-width: 1.4; }
      .script-doc { fill: #ecf1e4; stroke: #4f7a3f; stroke-width: 1.4; }
      .data-doc { fill: #fff1e6; stroke: #d97a4a; stroke-width: 1.4; }
      .file-name { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #1a2330; text-anchor: middle; }
      .file-role { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6770; text-anchor: middle; }
      .file-role-strong { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2c3744; text-anchor: middle; }
      .line { stroke: #7a8794; stroke-width: 1.4; fill: none; marker-end: url(#parrow); }
      .legend { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3a4654; }
      .legend-label { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a2330; }
    </style>
  </defs>
  <rect class="bg" width="800" height="560"/>

  <text class="band-label" x="32" y="34">FILE MAP · SELF-CONTAINED</text>
  <text class="title" x="32" y="58">女娲源 skill 目录 — 自包含，复制即可运行</text>

  <!-- Container box wrapping all nodes -->
  <rect class="container" x="40" y="86" width="720" height="380" rx="14"/>
  <text class="container-sub" x="56" y="110">SELF-CONTAINED DIRECTORY</text>
  <text class="container-label" x="56" y="128">~/.agents/skills/huashu-nuwa/</text>

  <!-- SKILL.md (entry, top) -->
  <g transform="translate(310 152)">
    <rect class="entry" width="180" height="60" rx="6"/>
    <text class="file-name" x="90" y="26">SKILL.md</text>
    <text class="file-role-strong" x="90" y="44">入口 · 9 Phase 流水线</text>
  </g>

  <!-- extraction-framework.md (left-mid, judge) -->
  <g transform="translate(70 248)">
    <rect class="meta-doc" width="200" height="64" rx="6"/>
    <text class="file-name" x="100" y="22">extraction-</text>
    <text class="file-name" x="100" y="38">framework.md</text>
    <text class="file-role" x="100" y="56">升级裁判 · 三重验证 / DNA / 张力</text>
  </g>

  <!-- skill-template.md (right-mid,骨架) -->
  <g transform="translate(530 248)">
    <rect class="meta-doc" width="200" height="64" rx="6"/>
    <text class="file-name" x="100" y="22">skill-template.md</text>
    <text class="file-role" x="100" y="42">成品骨架</text>
    <text class="file-role" x="100" y="56">人物 Skill 标准结构</text>
  </g>

  <!-- scripts/ (bottom-left) -->
  <g transform="translate(70 360)">
    <rect class="script-doc" width="200" height="80" rx="6"/>
    <text class="file-name" x="100" y="22">scripts/</text>
    <text class="file-role" x="100" y="40">download_subtitles.sh</text>
    <text class="file-role" x="100" y="54">srt_to_transcript.py</text>
    <text class="file-role" x="100" y="68">merge_research.py · quality_check.py</text>
  </g>

  <!-- references/research/ (bottom-mid) -->
  <g transform="translate(300 360)">
    <rect class="data-doc" width="200" height="80" rx="6"/>
    <text class="file-name" x="100" y="22">references/research/</text>
    <text class="file-role" x="100" y="40">6 份调研笔记</text>
    <text class="file-role" x="100" y="54">01.md … 06.md</text>
    <text class="file-role" x="100" y="68">+ extraction-notes.md</text>
  </g>

  <!-- references/sources/ (bottom-right) -->
  <g transform="translate(530 360)">
    <rect class="data-doc" width="200" height="80" rx="6"/>
    <text class="file-name" x="100" y="22">references/sources/</text>
    <text class="file-role" x="100" y="40">一手素材</text>
    <text class="file-role" x="100" y="54">books / transcripts / articles</text>
    <text class="file-role" x="100" y="68">下载后留底</text>
  </g>

  <!-- Arrows: who reads whom. Direction: SKILL.md reads everything else. -->
  <!-- SKILL.md → extraction-framework.md -->
  <path class="line" d="M340 212 C260 230 220 240 200 246"/>
  <!-- SKILL.md → skill-template.md -->
  <path class="line" d="M460 212 C560 230 600 240 620 246"/>
  <!-- SKILL.md → scripts/ -->
  <path class="line" d="M340 212 C200 250 130 320 150 358"/>
  <!-- SKILL.md → references/research/ -->
  <path class="line" d="M400 212 V358"/>
  <!-- SKILL.md → references/sources/ -->
  <path class="line" d="M460 212 C620 250 660 320 640 358"/>
  <!-- scripts/ → references/sources/ (downloads to) -->
  <path class="line" d="M270 400 H528"/>
  <!-- references/sources/ → references/research/ (read by agents) -->
  <path class="line" d="M528 412 H502"/>

  <!-- Legend -->
  <g transform="translate(40 488)">
    <text class="legend-label" x="0" y="0">图例</text>
    <rect class="entry" x="0" y="10" width="16" height="16" rx="2"/>
    <text class="legend" x="22" y="22">入口</text>
    <rect class="meta-doc" x="70" y="10" width="16" height="16" rx="2"/>
    <text class="legend" x="92" y="22">方法论 / 模板</text>
    <rect class="script-doc" x="200" y="10" width="16" height="16" rx="2"/>
    <text class="legend" x="222" y="22">脚本</text>
    <rect class="data-doc" x="270" y="10" width="16" height="16" rx="2"/>
    <text class="legend" x="292" y="22">调研 / 素材</text>
    <text class="legend" x="420" y="22">虚线箭头 = 读取关系</text>
  </g>

  <text class="legend" x="40" y="540" style="font-style:italic">所有产物在边框内 — 开源 / 迁移 / 复用都靠复制整个目录，不会丢证据。</text>
</svg>
