<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Nuwa package map</title>
  <desc id="desc">File responsibility map for the Nuwa skill package and generated skill package.</desc>
  <defs>
    <style>
      .bg{fill:#f6f1e6}
      .hub{fill:#fffaf0;stroke:#8a1c0f;stroke-width:2}
      .ref{fill:#ede6d4;stroke:#d8cdb6;stroke-width:2}
      .script{fill:#e8f0e7;stroke:#2d6e4e;stroke-width:2}
      .gen{fill:#f3ead2;stroke:#94701f;stroke-width:2}
      .text{fill:#1a1410;font-family:"Noto Serif SC","Source Han Serif SC",serif;font-size:23px;font-weight:700}
      .small{fill:#4a3f33;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
      .tiny{fill:#8a7a66;font-family:"JetBrains Mono",monospace;font-size:13px}
      .line{stroke:#8a1c0f;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8a1c0f"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="620"/>
  <text class="tiny" x="52" y="44">PACKAGE MAP / responsibilities, not a directory listing</text>

  <rect class="hub" x="430" y="72" width="320" height="120" rx="10"/>
  <text class="text" x="515" y="118">Nuwa SKILL.md</text>
  <text class="small" x="468" y="150">入口、阶段、检查点、验证规则</text>

  <rect class="ref" x="70" y="260" width="270" height="105" rx="10"/>
  <text class="text" x="108" y="304">extraction-framework</text>
  <text class="small" x="108" y="334">模型筛选、表达 DNA、边界</text>

  <rect class="ref" x="455" y="260" width="270" height="105" rx="10"/>
  <text class="text" x="510" y="304">skill-template</text>
  <text class="small" x="496" y="334">最终人物 skill 的骨架</text>

  <rect class="script" x="840" y="260" width="270" height="105" rx="10"/>
  <text class="text" x="930" y="304">scripts</text>
  <text class="small" x="882" y="334">字幕、摘要、质量检查</text>

  <rect class="gen" x="125" y="455" width="930" height="110" rx="12"/>
  <text class="text" x="425" y="500">generated person skill package</text>
  <text class="small" x="205" y="532">SKILL.md + references/research/01-06 + sources + scripts + honest boundaries + validation notes</text>

  <path class="line" d="M510 192 C430 230 310 235 225 260"/>
  <path class="line" d="M590 192 V260"/>
  <path class="line" d="M670 192 C755 230 875 235 965 260"/>
  <path class="line" d="M205 365 C260 420 390 440 505 455"/>
  <path class="line" d="M590 365 V455"/>
  <path class="line" d="M975 365 C910 420 790 440 675 455"/>

  <text class="tiny" x="72" y="596">Examples 校准输出长相，但不拥有规范。规范来自 SKILL.md 和 references。</text>
</svg>
