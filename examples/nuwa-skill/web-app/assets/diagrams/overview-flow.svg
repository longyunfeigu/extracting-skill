<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="女娲全流程顶层图：从入口分流到双 agent 精炼，三道检查点用星号标记">
  <defs>
    <marker id="ovf-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#8a1c0f" />
    </marker>
    <style>
      .ovf-bg { fill: #f6f1e6; }
      .ovf-phase { fill: #ede6d4; stroke: #d8cdb6; stroke-width: 1.4; }
      .ovf-phase-label { font: 600 14px "Noto Serif SC", Georgia, serif; fill: #1a1410; }
      .ovf-phase-sub { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a7a66; letter-spacing: 0.06em; }
      .ovf-cp { fill: rgba(138, 28, 15, 0.08); stroke: #8a1c0f; stroke-width: 1.6; }
      .ovf-cp-label { font: 700 13px "Noto Serif SC", Georgia, serif; fill: #8a1c0f; }
      .ovf-cp-sub { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a1c0f; }
      .ovf-arrow-line { stroke: #8a1c0f; stroke-width: 1.6; fill: none; }
      .ovf-title { font: 700 16px "Noto Serif SC", Georgia, serif; fill: #1a1410; letter-spacing: 0.02em; }
      .ovf-legend { font: 11px "JetBrains Mono", ui-monospace, monospace; fill: #8a7a66; letter-spacing: 0.12em; text-transform: uppercase; }
      .ovf-star { font: 900 22px "Noto Serif SC", Georgia, serif; fill: #8a1c0f; }
      .ovf-band { fill: rgba(26, 20, 16, 0.05); }
    </style>
  </defs>
  <rect class="ovf-bg" width="1000" height="360" />
  <text class="ovf-title" x="40" y="42">女娲全流程 · 11 个 Phase · 3 道便宜返工点</text>
  <text class="ovf-legend" x="40" y="62">从用户说一个名字 ⟶ 到一个可独立跑的人物 skill</text>

  <!-- Row 1: Phase 0 / 0A,0B / 0.5 / 1 -->
  <g transform="translate(40, 100)">
    <rect class="ovf-phase" x="0" y="0" width="160" height="62" rx="6" />
    <text class="ovf-phase-label" x="80" y="28" text-anchor="middle">入口分流</text>
    <text class="ovf-phase-sub" x="80" y="46" text-anchor="middle">Phase 0</text>
  </g>
  <path class="ovf-arrow-line" d="M 200 131 L 230 131" marker-end="url(#ovf-arrow)" />
  <g transform="translate(240, 100)">
    <rect class="ovf-phase" x="0" y="0" width="160" height="62" rx="6" />
    <text class="ovf-phase-label" x="80" y="28" text-anchor="middle">需求澄清 / 诊断</text>
    <text class="ovf-phase-sub" x="80" y="46" text-anchor="middle">Phase 0A or 0B</text>
  </g>
  <path class="ovf-arrow-line" d="M 400 131 L 430 131" marker-end="url(#ovf-arrow)" />
  <g transform="translate(440, 100)">
    <rect class="ovf-phase" x="0" y="0" width="160" height="62" rx="6" />
    <text class="ovf-phase-label" x="80" y="28" text-anchor="middle">创建 skill 目录</text>
    <text class="ovf-phase-sub" x="80" y="46" text-anchor="middle">Phase 0.5</text>
  </g>
  <path class="ovf-arrow-line" d="M 600 131 L 630 131" marker-end="url(#ovf-arrow)" />
  <g transform="translate(640, 100)">
    <rect class="ovf-phase" x="0" y="0" width="180" height="62" rx="6" />
    <text class="ovf-phase-label" x="90" y="26" text-anchor="middle">6 agent 并行采集</text>
    <text class="ovf-phase-sub" x="90" y="46" text-anchor="middle">Phase 1 · 著作 / 对话 / 表达 / 他者 / 决策 / 时间线</text>
  </g>
  <path class="ovf-arrow-line" d="M 820 131 L 860 131 L 860 195" marker-end="url(#ovf-arrow)" />

  <!-- Row 2: 1.5★ → 2 → 2.5★ → 3 → 4★ → 5 -->
  <g transform="translate(860, 200)">
    <rect class="ovf-cp" x="-50" y="0" width="100" height="62" rx="6" />
    <text class="ovf-star" x="0" y="22" text-anchor="middle">★</text>
    <text class="ovf-cp-label" x="0" y="42" text-anchor="middle">检查点</text>
    <text class="ovf-cp-sub" x="0" y="56" text-anchor="middle">1.5</text>
  </g>
  <path class="ovf-arrow-line" d="M 810 231 L 760 231" marker-end="url(#ovf-arrow)" />
  <g transform="translate(660, 200)">
    <rect class="ovf-phase" x="0" y="0" width="100" height="62" rx="6" />
    <text class="ovf-phase-label" x="50" y="28" text-anchor="middle">框架提炼</text>
    <text class="ovf-phase-sub" x="50" y="46" text-anchor="middle">Phase 2</text>
  </g>
  <path class="ovf-arrow-line" d="M 660 231 L 610 231" marker-end="url(#ovf-arrow)" />
  <g transform="translate(510, 200)">
    <rect class="ovf-cp" x="0" y="0" width="100" height="62" rx="6" />
    <text class="ovf-star" x="50" y="22" text-anchor="middle">★</text>
    <text class="ovf-cp-label" x="50" y="42" text-anchor="middle">检查点</text>
    <text class="ovf-cp-sub" x="50" y="56" text-anchor="middle">2.5</text>
  </g>
  <path class="ovf-arrow-line" d="M 510 231 L 460 231" marker-end="url(#ovf-arrow)" />
  <g transform="translate(360, 200)">
    <rect class="ovf-phase" x="0" y="0" width="100" height="62" rx="6" />
    <text class="ovf-phase-label" x="50" y="28" text-anchor="middle">skill 构建</text>
    <text class="ovf-phase-sub" x="50" y="46" text-anchor="middle">Phase 3</text>
  </g>
  <path class="ovf-arrow-line" d="M 360 231 L 310 231" marker-end="url(#ovf-arrow)" />
  <g transform="translate(210, 200)">
    <rect class="ovf-cp" x="0" y="0" width="100" height="62" rx="6" />
    <text class="ovf-star" x="50" y="22" text-anchor="middle">★</text>
    <text class="ovf-cp-label" x="50" y="42" text-anchor="middle">检查点</text>
    <text class="ovf-cp-sub" x="50" y="56" text-anchor="middle">Phase 4</text>
  </g>
  <path class="ovf-arrow-line" d="M 210 231 L 160 231" marker-end="url(#ovf-arrow)" />
  <g transform="translate(40, 200)">
    <rect class="ovf-phase" x="0" y="0" width="120" height="62" rx="6" />
    <text class="ovf-phase-label" x="60" y="28" text-anchor="middle">双 agent 精炼</text>
    <text class="ovf-phase-sub" x="60" y="46" text-anchor="middle">Phase 5</text>
  </g>

  <!-- Legend band -->
  <rect class="ovf-band" x="40" y="300" width="920" height="32" rx="4" />
  <text class="ovf-legend" x="56" y="320">★ = 必须停下来等用户拍板的便宜返工点 · 文本都还在手里，没生成任何昂贵产物</text>
</svg>
