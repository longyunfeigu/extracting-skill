<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">9-Phase 流水线 orientation map</title>
  <desc id="desc">女娲 9 个 Phase 分成确认 / 存证 / 提炼 / 构建 / 验证 五段，区分 Hard Checkpoint 与 Auto Decision Phase。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8794"/>
    </marker>
    <style>
      .bg { fill: #fafafa; }
      .band-label { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #5b6770; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a2330; }
      .legend-text { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3a4654; }
      .phase-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a2330; }
      .phase-sub { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6770; }
      .seg-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2c3744; }
      .seg-note { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7886; }
      .auto-fill { fill: #e8eef5; stroke: #b6c3d1; stroke-width: 1.4; }
      .check-fill { fill: #fff1e6; stroke: #d97a4a; stroke-width: 2; }
      .line { stroke: #7a8794; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .seg-rect { fill: none; stroke: #c8d1da; stroke-width: 1; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <rect class="bg" width="800" height="560"/>

  <text class="band-label" x="32" y="34">ORIENTATION</text>
  <text class="title" x="32" y="58">9 Phase 流水线 · 5 段 · 3 道 Hard Checkpoint</text>

  <!-- Segment frames -->
  <g>
    <rect class="seg-rect" x="32" y="100" width="100" height="220" rx="6"/>
    <text class="seg-title" x="44" y="120">确认</text>
    <text class="seg-note" x="44" y="136">入口分流</text>

    <rect class="seg-rect" x="148" y="100" width="220" height="220" rx="6"/>
    <text class="seg-title" x="160" y="120">存证</text>
    <text class="seg-note" x="160" y="136">建目录 + 6 路并行 + 调研 review</text>

    <rect class="seg-rect" x="384" y="100" width="148" height="220" rx="6"/>
    <text class="seg-title" x="396" y="120">提炼</text>
    <text class="seg-note" x="396" y="136">三重验证 + 摘要确认</text>

    <rect class="seg-rect" x="548" y="100" width="100" height="220" rx="6"/>
    <text class="seg-title" x="560" y="120">构建</text>
    <text class="seg-note" x="560" y="136">SKILL.md + Protocol</text>

    <rect class="seg-rect" x="664" y="100" width="100" height="220" rx="6"/>
    <text class="seg-title" x="676" y="120">验证</text>
    <text class="seg-note" x="676" y="136">三测 + 双精炼</text>
  </g>

  <!-- Phase 0A (auto) -->
  <g transform="translate(48 184)">
    <rect class="auto-fill" width="72" height="80" rx="14"/>
    <text class="phase-title" x="36" y="32" text-anchor="middle">Phase 0A</text>
    <text class="phase-sub" x="36" y="50" text-anchor="middle">入口分流</text>
    <text class="phase-sub" x="36" y="64" text-anchor="middle">明确人名</text>
  </g>

  <!-- Phase 0.5 (auto) -->
  <g transform="translate(164 184)">
    <rect class="auto-fill" width="60" height="80" rx="14"/>
    <text class="phase-title" x="30" y="32" text-anchor="middle">0.5</text>
    <text class="phase-sub" x="30" y="50" text-anchor="middle">建目录</text>
    <text class="phase-sub" x="30" y="64" text-anchor="middle">scaffold</text>
  </g>

  <!-- Phase 1 (auto) -->
  <g transform="translate(236 184)">
    <rect class="auto-fill" width="60" height="80" rx="14"/>
    <text class="phase-title" x="30" y="32" text-anchor="middle">1</text>
    <text class="phase-sub" x="30" y="50" text-anchor="middle">6 路</text>
    <text class="phase-sub" x="30" y="64" text-anchor="middle">fan-out</text>
  </g>

  <!-- Phase 1.5 (HARD CHECKPOINT) - diamond -->
  <g transform="translate(308 184)">
    <polygon class="check-fill" points="40,0 80,40 40,80 0,40"/>
    <text class="phase-title" x="40" y="38" text-anchor="middle">1.5</text>
    <text class="phase-sub" x="40" y="52" text-anchor="middle">调研</text>
    <text class="phase-sub" x="40" y="65" text-anchor="middle">review</text>
  </g>

  <!-- Phase 2 (auto) -->
  <g transform="translate(400 184)">
    <rect class="auto-fill" width="60" height="80" rx="14"/>
    <text class="phase-title" x="30" y="32" text-anchor="middle">2</text>
    <text class="phase-sub" x="30" y="50" text-anchor="middle">三重</text>
    <text class="phase-sub" x="30" y="64" text-anchor="middle">验证</text>
  </g>

  <!-- Phase 2.5 (HARD CHECKPOINT) -->
  <g transform="translate(472 184)">
    <polygon class="check-fill" points="40,0 80,40 40,80 0,40"/>
    <text class="phase-title" x="40" y="38" text-anchor="middle">2.5</text>
    <text class="phase-sub" x="40" y="52" text-anchor="middle">摘要</text>
    <text class="phase-sub" x="40" y="65" text-anchor="middle">确认</text>
  </g>

  <!-- Phase 3 (auto) -->
  <g transform="translate(564 184)">
    <rect class="auto-fill" width="72" height="80" rx="14"/>
    <text class="phase-title" x="36" y="32" text-anchor="middle">Phase 3</text>
    <text class="phase-sub" x="36" y="50" text-anchor="middle">SKILL.md</text>
    <text class="phase-sub" x="36" y="64" text-anchor="middle">+ Protocol</text>
  </g>

  <!-- Phase 4 (HARD CHECKPOINT) -->
  <g transform="translate(672 184)">
    <polygon class="check-fill" points="40,0 80,40 40,80 0,40"/>
    <text class="phase-title" x="40" y="38" text-anchor="middle">Phase 4</text>
    <text class="phase-sub" x="40" y="52" text-anchor="middle">三测</text>
    <text class="phase-sub" x="40" y="65" text-anchor="middle">验证</text>
  </g>

  <!-- Phase 5 (auto) -->
  <g transform="translate(688 290)">
    <rect class="auto-fill" width="60" height="46" rx="10"/>
    <text class="phase-title" x="30" y="22" text-anchor="middle">Phase 5</text>
    <text class="phase-sub" x="30" y="38" text-anchor="middle">双精炼</text>
  </g>

  <!-- Arrows between phases -->
  <path class="line" d="M122 224 H162"/>
  <path class="line" d="M226 224 H234"/>
  <path class="line" d="M298 224 H306"/>
  <path class="line" d="M390 224 H398"/>
  <path class="line" d="M462 224 H470"/>
  <path class="line" d="M554 224 H562"/>
  <path class="line" d="M638 224 H670"/>
  <path class="line" d="M712 266 V288"/>

  <!-- Legend -->
  <g transform="translate(32 380)">
    <text class="band-label" x="0" y="0">LEGEND</text>

    <rect class="auto-fill" x="0" y="14" width="28" height="20" rx="6"/>
    <text class="legend-text" x="38" y="29">Auto Decision Phase · 有 default，按规则自动推进，记进 AD Log</text>

    <polygon class="check-fill" points="14,52 28,66 14,80 0,66"/>
    <text class="legend-text" x="38" y="71">Hard Checkpoint · 无 default，必须停下来等用户确认</text>

    <text class="legend-text" x="0" y="108">本次 trace（塔勒布 case）3 道 Hard Checkpoint 全部由 analyst proxy 推进，所有 proxy 决定写进 Auto Decision Log。</text>
  </g>

  <!-- Footer count -->
  <g transform="translate(32 502)">
    <text class="seg-note" x="0" y="0">6 个 Auto Phase（0A / 0.5 / 1 / 2 / 3 / 5）　+　3 个 Hard Checkpoint（1.5 / 2.5 / 4）　=　9 Phase</text>
    <text class="seg-note" x="0" y="18">从「写一个角色 prompt」（默认 AI 路径）变成「跑一条证据生产线」——产物是自包含目录，不是单文件。</text>
  </g>
</svg>
