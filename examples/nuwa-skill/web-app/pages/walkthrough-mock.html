<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walkthrough · UI Mock · 女娲 · Skill 造人术解剖手册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f1e6;
        --paper-2: #ede6d4;
        --ink: #1a1410;
        --ink-2: #4a3f33;
        --ink-mute: #8a7a66;
        --rule: #d8cdb6;
        --accent: #8a1c0f;          /* deep oxblood — single accent */
        --accent-soft: rgba(138, 28, 15, 0.08);
        --accent-line: rgba(138, 28, 15, 0.35);
        --night: #161210;            /* dark inset surface */
        --night-2: #221c18;
        --night-text: #ece3d0;
        --night-mute: #948876;
        --night-rule: #2e2620;
        --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, "Times New Roman", serif;
        --sans: "PingFang SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.78;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: "kern", "liga", "calt", "ss01";
      }

      /* Subtle paper texture — pure CSS, no image needed */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(138, 28, 15, 0.03) 0, transparent 40%),
          radial-gradient(circle at 88% 82%, rgba(26, 20, 16, 0.04) 0, transparent 35%);
        mix-blend-mode: multiply;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1180px, 100% - 48px);
        margin: 0 auto;
      }

      /* ─── Masthead ─────────────────────────────────── */
      .masthead {
        padding: 36px 0 28px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }

      .masthead-left {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }

      .masthead-mark {
        font-family: var(--serif);
        font-weight: 900;
        font-size: 22px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .masthead-mark::before {
        content: "❖";
        color: var(--accent);
        margin-right: 8px;
        font-size: 16px;
        vertical-align: 1px;
      }

      .masthead-section {
        font-family: var(--sans);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-mute);
        font-weight: 600;
      }

      .masthead-meta {
        font-family: var(--sans);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-mute);
        font-weight: 500;
      }

      /* ─── Hero ─────────────────────────────────────── */
      .hero {
        padding: 96px 0 80px;
        position: relative;
      }

      .hero-eyebrow {
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 28px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .hero-eyebrow::after {
        content: "";
        flex: 0 0 auto;
        width: 64px;
        height: 1px;
        background: var(--accent);
      }

      .hero-title {
        font-family: var(--serif);
        font-weight: 900;
        font-size: clamp(56px, 9vw, 132px);
        line-height: 0.95;
        letter-spacing: -0.03em;
        margin: 0 0 28px;
        color: var(--ink);
        max-width: 14ch;
      }

      .hero-subtitle {
        font-family: var(--serif);
        font-weight: 500;
        font-style: italic;
        font-size: clamp(22px, 2.4vw, 30px);
        line-height: 1.4;
        max-width: 28ch;
        margin: 0 0 40px;
        color: var(--ink-2);
        letter-spacing: -0.005em;
      }

      .hero-lede {
        font-family: var(--serif);
        font-size: 18px;
        line-height: 1.8;
        color: var(--ink-2);
        max-width: 56ch;
        margin: 0 0 28px;
      }

      .hero-lede strong {
        color: var(--ink);
        font-weight: 700;
        background: linear-gradient(transparent 60%, rgba(232, 200, 90, 0.45) 60%);
        padding: 0 2px;
      }

      .hero-rule {
        margin: 56px 0 0;
        height: 1px;
        background: var(--ink);
        width: 96px;
      }

      /* ─── Stage index (top chips) ──────────────────── */
      .index-bar {
        padding: 40px 0 64px;
        border-bottom: 1px solid var(--rule);
      }

      .index-label {
        font-family: var(--sans);
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink-mute);
        margin: 0 0 18px;
        font-weight: 600;
      }

      .index-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0;
        border-top: 1px solid var(--rule);
      }

      .index-item {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: baseline;
        padding: 16px 14px 16px 0;
        border-bottom: 1px solid var(--rule);
        color: var(--ink);
        text-decoration: none;
        transition: background 140ms ease, padding-left 140ms ease;
      }

      .index-item:hover {
        background: var(--accent-soft);
        padding-left: 10px;
      }

      .index-item .num {
        font-family: var(--serif);
        font-weight: 700;
        font-style: italic;
        color: var(--accent);
        font-size: 13px;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      .index-item .label {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.4;
        color: var(--ink);
      }

      /* ─── Stage ────────────────────────────────────── */
      .stage {
        padding: 120px 0 80px;
        border-bottom: 1px solid var(--rule);
        scroll-margin-top: 24px;
      }

      .stage:last-child {
        border-bottom: 0;
      }

      .stage-head {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(0, 720px) minmax(80px, 1fr);
        gap: 32px;
        align-items: start;
        margin-bottom: 48px;
      }

      .stage-num {
        font-family: var(--serif);
        font-weight: 900;
        font-style: italic;
        font-size: clamp(96px, 14vw, 168px);
        line-height: 0.85;
        color: var(--accent);
        margin: 0;
        text-align: right;
        letter-spacing: -0.03em;
        font-feature-settings: "ss01";
      }

      .stage-headline {
        max-width: 720px;
      }

      .stage-kicker {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }

      .stage-title {
        font-family: var(--serif);
        font-weight: 700;
        font-size: clamp(28px, 3.4vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.015em;
        margin: 0 0 24px;
        color: var(--ink);
      }

      .stage-summary {
        font-family: var(--serif);
        font-weight: 400;
        font-style: italic;
        font-size: 20px;
        line-height: 1.6;
        color: var(--ink-2);
        margin: 0;
        max-width: 680px;
        border-left: 2px solid var(--accent);
        padding-left: 20px;
      }

      .stage-body {
        max-width: 720px;
        margin: 0 auto;
      }

      /* ─── Pre-test sidenote ────────────────────────── */
      .pretest {
        margin: 40px 0;
        padding: 24px 28px;
        background: var(--paper-2);
        border-left: 3px solid var(--ink);
        font-family: var(--serif);
        position: relative;
      }

      .pretest::before {
        content: "?";
        position: absolute;
        top: 14px;
        right: 22px;
        font-family: var(--serif);
        font-weight: 900;
        font-style: italic;
        font-size: 56px;
        line-height: 1;
        color: var(--ink);
        opacity: 0.1;
      }

      .pretest-label {
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 10px;
        display: block;
      }

      .pretest-body {
        font-size: 16px;
        line-height: 1.72;
        color: var(--ink);
        margin: 0;
      }

      /* ─── Narrative body ───────────────────────────── */
      .narrative p,
      .narrative ul,
      .narrative ol {
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.85;
        color: var(--ink);
        margin: 0 0 22px;
      }

      .narrative p strong {
        font-weight: 700;
        color: var(--ink);
      }

      .narrative p strong:first-child {
        color: var(--accent);
      }

      .narrative ul {
        padding-left: 0;
        list-style: none;
      }

      .narrative ul li {
        position: relative;
        padding-left: 28px;
        margin-bottom: 10px;
      }

      .narrative ul li::before {
        content: "—";
        position: absolute;
        left: 0;
        top: 0;
        color: var(--accent);
        font-weight: 700;
      }

      /* Inline code in narrative */
      .inline-code {
        font-family: var(--mono);
        font-size: 0.86em;
        background: var(--paper-2);
        padding: 2px 7px;
        border-radius: 3px;
        color: var(--accent);
        font-weight: 500;
        white-space: nowrap;
      }

      /* Dark code blocks — the contrast inserts */
      .code-block {
        margin: 32px -8px;
        padding: 0;
        background: var(--night);
        border-radius: 6px;
        overflow: hidden;
        font-family: var(--mono);
        position: relative;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 24px 40px -24px rgba(26, 20, 16, 0.35);
      }

      .code-block .code-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--night-2);
        border-bottom: 1px solid var(--night-rule);
      }

      .code-block .code-dots {
        display: flex;
        gap: 6px;
      }

      .code-block .code-dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--night-rule);
      }

      .code-block .code-dots span:first-child {
        background: rgba(232, 109, 96, 0.55);
      }

      .code-block .code-dots span:nth-child(2) {
        background: rgba(232, 196, 96, 0.55);
      }

      .code-block .code-dots span:last-child {
        background: rgba(120, 200, 130, 0.45);
      }

      .code-block .code-lang {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--night-mute);
      }

      .code-block pre {
        margin: 0;
        padding: 22px 24px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--night-text);
        white-space: pre;
      }

      .code-block pre code {
        font-family: inherit;
        color: inherit;
      }

      /* ─── Reusable move (pull quote) ───────────────── */
      .move {
        margin: 56px 0 48px;
        padding: 36px 0;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        text-align: left;
        position: relative;
      }

      .move::before {
        content: "“";
        position: absolute;
        top: -38px;
        left: -24px;
        font-family: var(--serif);
        font-weight: 900;
        font-size: 140px;
        line-height: 1;
        color: var(--accent);
        opacity: 0.18;
      }

      .move-label {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 18px;
      }

      .move-body {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.55;
        color: var(--ink);
        margin: 0;
        letter-spacing: -0.005em;
        font-style: italic;
        max-width: 36ch;
      }

      /* ─── Quick reference (collapsed) ──────────────── */
      .quickref {
        margin: 48px 0 32px;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: rgba(246, 241, 230, 0.5);
      }

      .quickref summary {
        cursor: pointer;
        padding: 16px 22px;
        font-family: var(--sans);
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-2);
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .quickref summary::-webkit-details-marker {
        display: none;
      }

      .quickref summary::after {
        content: "+";
        font-family: var(--serif);
        font-weight: 300;
        font-size: 22px;
        color: var(--accent);
        transition: transform 200ms ease;
      }

      .quickref[open] summary::after {
        content: "−";
      }

      .quickref-grid {
        padding: 0 22px 22px;
        display: grid;
        gap: 18px;
      }

      .quickref-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--rule);
        align-items: baseline;
      }

      .quickref-row .qr-label {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        line-height: 1.4;
      }

      .quickref-row .qr-body,
      .quickref-row .qr-body p,
      .quickref-row .qr-body ul {
        font-family: var(--serif);
        font-size: 15px;
        line-height: 1.65;
        color: var(--ink-2);
        margin: 0;
      }

      .quickref-row .qr-body ul {
        padding-left: 18px;
        list-style: disc;
      }

      /* ─── Challenges (discussion questions) ────────── */
      .challenges {
        margin: 48px 0 0;
        padding: 40px 36px 36px;
        background: var(--paper-2);
        border-radius: 4px;
        position: relative;
      }

      .challenges-rule {
        position: absolute;
        top: 0;
        left: 36px;
        right: 36px;
        height: 3px;
        background: var(--accent);
      }

      .challenges-head {
        display: grid;
        gap: 6px;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--rule);
      }

      .challenges-title {
        font-family: var(--serif);
        font-weight: 700;
        font-style: italic;
        font-size: 24px;
        color: var(--accent);
        margin: 0;
        letter-spacing: -0.01em;
      }

      .challenges-sub {
        font-family: var(--sans);
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink-mute);
        margin: 0;
        font-style: italic;
      }

      .challenges-list {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: q;
        display: grid;
        gap: 22px;
      }

      .challenges-list li {
        counter-increment: q;
        position: relative;
        padding-left: 56px;
        font-family: var(--serif);
        font-size: 16px;
        line-height: 1.75;
        color: var(--ink);
      }

      .challenges-list li::before {
        content: "Q" counter(q, decimal-leading-zero);
        position: absolute;
        left: 0;
        top: 2px;
        font-family: var(--serif);
        font-weight: 900;
        font-style: italic;
        font-size: 18px;
        color: var(--accent);
        letter-spacing: 0.02em;
      }

      /* ─── Footer ───────────────────────────────────── */
      .end-mark {
        margin: 96px 0 32px;
        text-align: center;
        color: var(--accent);
        font-family: var(--serif);
        font-size: 28px;
        letter-spacing: 0.6em;
        padding-left: 0.6em;
      }

      .end-note {
        text-align: center;
        font-family: var(--serif);
        font-style: italic;
        color: var(--ink-mute);
        font-size: 15px;
        margin: 0 0 80px;
      }

      /* ─── Responsive ───────────────────────────────── */
      @media (max-width: 900px) {
        .stage {
          padding: 80px 0 60px;
        }

        .stage-head {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .stage-num {
          text-align: left;
          font-size: 88px;
        }

        .stage-summary {
          padding-left: 16px;
        }

        .move::before {
          left: -8px;
          font-size: 96px;
        }

        .code-block {
          margin: 28px -12px;
        }

        .quickref-row {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .challenges {
          padding: 32px 22px 28px;
        }

        .challenges-rule {
          left: 22px;
          right: 22px;
        }

        .challenges-list li {
          padding-left: 44px;
        }
      }

      @media (max-width: 600px) {
        body {
          font-size: 16.5px;
        }

        .page {
          width: calc(100% - 32px);
        }
      }
    </style>
  </head>
  <body>
    <main id="root" class="page"></main>

    <script src="../assets/data.js"></script>
    <script>
      (function () {
        const data = window.handbook || {};
        const stages = data.walkthrough || [];

        function escapeHtml(value = "") {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function renderRich(value = "") {
          return escapeHtml(value)
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
        }

        function pad2(n) {
          return String(n).padStart(2, "0");
        }

        function renderBlock(block) {
          if (!block || !block.kind) return "";
          if (block.kind === "para") {
            return `<p>${renderRich(block.text || "")}</p>`;
          }
          if (block.kind === "list") {
            const items = (block.items || [])
              .map((item) => `<li>${renderRich(item)}</li>`)
              .join("");
            return `<ul>${items}</ul>`;
          }
          if (block.kind === "code") {
            const lang = block.lang || "text";
            return `
              <figure class="code-block">
                <div class="code-chrome">
                  <span class="code-dots"><span></span><span></span><span></span></span>
                  <span class="code-lang">${escapeHtml(lang)}</span>
                </div>
                <pre><code>${escapeHtml(block.text || "")}</code></pre>
              </figure>`;
          }
          if (block.kind === "quote") {
            return `<blockquote class="narrative-quote">${escapeHtml(block.text || "")}</blockquote>`;
          }
          if (block.kind === "diagram") {
            return ""; /* mock skips embedded diagrams to keep reading flow */
          }
          return "";
        }

        function renderQuickref(stage) {
          const rows = [
            ["这一步收到什么", stage.receives],
            ["skill 让我读什么", stage.reads],
            ["我不能直接做什么", stage.blockedShortcut],
            ["我做什么", stage.action],
            ["我产出什么", stage.output],
            ["下一步谁用它", stage.nextConsumer]
          ].filter(([, v]) => v && (!Array.isArray(v) || v.length));

          if (!rows.length) return "";

          const body = rows
            .map(([label, value]) => {
              const content = Array.isArray(value)
                ? `<ul>${value.map((v) => `<li>${escapeHtml(v)}</li>`).join("")}</ul>`
                : `<p>${escapeHtml(value)}</p>`;
              return `
                <div class="quickref-row">
                  <span class="qr-label">${escapeHtml(label)}</span>
                  <div class="qr-body">${content}</div>
                </div>`;
            })
            .join("");

          return `
            <details class="quickref">
              <summary>七字段速查 · Stage metadata</summary>
              <div class="quickref-grid">${body}</div>
            </details>`;
        }

        function renderChallenges(stage) {
          if (!Array.isArray(stage.challenges) || !stage.challenges.length) return "";
          const items = stage.challenges
            .map((c) => `<li>${escapeHtml(c)}</li>`)
            .join("");
          return `
            <section class="challenges">
              <span class="challenges-rule"></span>
              <header class="challenges-head">
                <h3 class="challenges-title">你的练习</h3>
                <p class="challenges-sub">不是 AI 的内心独白——是给读这本手册的你的题。先想再读下一阶段。</p>
              </header>
              <ol class="challenges-list">${items}</ol>
            </section>`;
        }

        function renderStage(stage, i) {
          const num = pad2(i + 1);
          const id = escapeHtml(stage.id || `stage-${i + 1}`);
          const pretest = stage.preTest
            ? `<aside class="pretest">
                <span class="pretest-label">先猜一遍 · pre-test</span>
                <p class="pretest-body">${escapeHtml(stage.preTest)}</p>
              </aside>`
            : "";

          const narrative = Array.isArray(stage.narrativeBody)
            ? stage.narrativeBody.map(renderBlock).join("")
            : "";

          const move = stage.reusableMove
            ? `<aside class="move">
                <div class="move-label">这里能偷的招</div>
                <p class="move-body">${escapeHtml(stage.reusableMove)}</p>
              </aside>`
            : "";

          return `
            <article class="stage" id="${id}">
              <header class="stage-head">
                <p class="stage-num">${num}</p>
                <div class="stage-headline">
                  <p class="stage-kicker">阶段 ${num}</p>
                  <h2 class="stage-title">${escapeHtml(stage.title || "")}</h2>
                  ${stage.summary ? `<p class="stage-summary">${escapeHtml(stage.summary)}</p>` : ""}
                </div>
                <div></div>
              </header>
              <div class="stage-body">
                ${pretest}
                <div class="narrative">${narrative}</div>
                ${move}
                ${renderQuickref(stage)}
                ${renderChallenges(stage)}
              </div>
            </article>`;
        }

        function renderIndex() {
          const items = stages
            .map((s, i) => {
              const num = pad2(i + 1);
              const id = escapeHtml(s.id || `stage-${i + 1}`);
              const title = escapeHtml(s.title || "").split(/[，——]/)[0];
              return `
                <a class="index-item" href="#${id}">
                  <span class="num">${num}</span>
                  <span class="label">${title}</span>
                </a>`;
            })
            .join("");
          return `
            <section class="index-bar" aria-label="Stage index">
              <p class="index-label">全 ${stages.length} 个阶段 · 点击跳转</p>
              <div class="index-grid">${items}</div>
            </section>`;
        }

        function render() {
          const oneLiner = (data.overview && data.overview.oneLiner) || "";
          const html = `
            <header class="masthead">
              <div class="masthead-left">
                <a class="masthead-mark" href="../index.html">女娲 · 解剖手册</a>
                <span class="masthead-section">章 02 / Walkthrough</span>
              </div>
              <span class="masthead-meta">UI Mock · v1</span>
            </header>

            <section class="hero">
              <p class="hero-eyebrow">Walkthrough · 章 02</p>
              <h1 class="hero-title">AI 运行<br/>轨迹</h1>
              <p class="hero-subtitle">14 个 stage 看 AI 被女娲一步步拦下来的完整路径。</p>
              <p class="hero-lede">${renderRich(oneLiner)}</p>
              <p class="hero-lede">这是本手册的脊柱。下面每一阶段都用同一个例子（蒸馏塔勒布）落地，每个 stage 卡同时回答 7 件事：<strong>这一步收到什么 / skill 让我读什么 / 我不能直接做什么 / 我做什么 / 我产出什么 / 下一步谁用它 / 这里能偷的招</strong>。</p>
              <div class="hero-rule"></div>
            </section>

            ${renderIndex()}

            <section>
              ${stages.map(renderStage).join("")}
            </section>

            <p class="end-mark">❖ ❖ ❖</p>
            <p class="end-note">章 02 / Walkthrough — 完</p>
          `;
          document.getElementById("root").innerHTML = html;
        }

        render();
      })();
    </script>
  </body>
</html>
